<!doctype html>
<meta charset="utf-8">
<title>FISH TARGET mobile overflow QA</title>
<style>body{margin:0}iframe{display:block;height:844px;border:0}</style>
<pre id="results">RUNNING</pre>
<iframe data-width="375" style="width:375px" src="../index.html?qa=375"></iframe>
<iframe data-width="390" style="width:390px" src="../index.html?qa=390"></iframe>
<iframe data-width="430" style="width:430px" src="../index.html?qa=430"></iframe>
<script>
  const frames=[...document.querySelectorAll('iframe')];
  Promise.all(frames.map(frame=>new Promise(resolve=>{
    if(frame.contentDocument?.readyState==='complete')resolve();
    else frame.addEventListener('load',resolve,{once:true});
  }))).then(()=>{
    const results=frames.map(frame=>{
      const root=frame.contentDocument.documentElement;
      const body=frame.contentDocument.body;
      const clientWidth=root.clientWidth;
      const scrollWidth=Math.max(root.scrollWidth,body.scrollWidth);
      return {target:+frame.dataset.width,clientWidth,scrollWidth,overflow:scrollWidth-clientWidth};
    });
    document.getElementById('results').textContent=JSON.stringify(results);
  });
</script>
