name: rc-qa

on:
  pull_request:
  push:
    branches: [main, chatgpt/rc-v23-v8, chatgpt/catalog-production-v1, chatgpt/catalog-lazy-load-v1, chatgpt/catalog-scale-v1, chatgpt/catalog-multimaker-v2, chatgpt/catalog-multimaker-v3, chatgpt/target-method-expansion-v1, chatgpt/target-method-expansion-v2, chatgpt/target-method-expansion-v3, chatgpt/target-method-expansion-v4]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, build, regression, and catalog scale
        run: |
          npm run test:syntax
          npm test
          node scripts/catalog-scale-qa.mjs
