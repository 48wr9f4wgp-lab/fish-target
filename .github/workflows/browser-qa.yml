name: rc-browser-qa

on:
  push:
    branches: [chatgpt/rc-v23-v8, chatgpt/catalog-production-v1, chatgpt/catalog-lazy-load-v1, chatgpt/catalog-scale-v1, chatgpt/catalog-multimaker-v2, chatgpt/catalog-multimaker-v3, chatgpt/catalog-multimaker-v4, chatgpt/catalog-multimaker-v5, chatgpt/catalog-multimaker-v6, chatgpt/catalog-multimaker-v7, chatgpt/catalog-multimaker-v8, chatgpt/catalog-multimaker-v9, chatgpt/catalog-multimaker-v10, chatgpt/catalog-multimaker-v11, chatgpt/catalog-multimaker-v13, chatgpt/target-method-expansion-v1, chatgpt/target-method-expansion-v2, chatgpt/target-method-expansion-v3, chatgpt/target-method-expansion-v4]
  pull_request:

concurrency:
  group: rc-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build RC
        run: npm run build
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA 375 390 430 and offline
        run: |
          npm run serve > /tmp/fish-target-serve.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/dist/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/dist/ >/dev/null
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$TARGET_BRANCH" in
            chatgpt/rc-product-quality-*) node scripts/startup-boot-browser-qa.mjs && node scripts/content-expansion-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/visual-v24-browser-qa.mjs && node scripts/visual-v25-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/pack-game-feel-v28-browser-qa.mjs && node scripts/tackle-auto-build-v29-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/my-tackle-resolver-*) node scripts/startup-boot-browser-qa.mjs && node scripts/content-expansion-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/visual-v24-browser-qa.mjs && node scripts/visual-v25-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/pack-game-feel-v28-browser-qa.mjs && node scripts/tackle-auto-build-v29-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/pack-*) node scripts/startup-boot-browser-qa.mjs && node scripts/content-expansion-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/pack-game-feel-v28-browser-qa.mjs && node scripts/tackle-auto-build-v29-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/tackle-auto-build-*) node scripts/startup-boot-browser-qa.mjs && node scripts/content-expansion-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/visual-v24-browser-qa.mjs && node scripts/visual-v25-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/pack-game-feel-v28-browser-qa.mjs && node scripts/tackle-auto-build-v29-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/game-feel-*) node scripts/startup-boot-browser-qa.mjs && node scripts/content-expansion-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/pack-game-feel-v28-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/perf-*) node scripts/startup-boot-browser-qa.mjs && node scripts/content-expansion-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/visual-v24-browser-qa.mjs && node scripts/visual-v25-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/perf-clarity-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/content-expansion-*) node scripts/startup-boot-browser-qa.mjs && node scripts/content-expansion-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/visual-v24-browser-qa.mjs && node scripts/visual-v25-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/catalog-multimaker-v*|chatgpt/platform-architecture-v*|chatgpt/fish-taxonomy-*|chatgpt/fish-rights-*) node scripts/startup-boot-browser-qa.mjs && node scripts/result-ux-v20-browser-qa.mjs && node scripts/visual-v24-browser-qa.mjs && node scripts/visual-v25-browser-qa.mjs && node scripts/app-shell-v26-browser-qa.mjs && node scripts/fish-asset-manifest-browser-qa.mjs && node scripts/fish-photo-v27-browser-qa.mjs && node scripts/target-browser-qa.mjs && node scripts/species-registry-browser-qa.mjs && node scripts/resolver-engine-browser-qa.mjs && node scripts/catalog-recommendation-coverage-browser-qa.mjs && node scripts/catalog-lazy-browser-qa.mjs && node scripts/catalog-majorcraft-browser-qa.mjs && node scripts/catalog-vendor-browser-qa.mjs && node scripts/catalog-tict-browser-qa.mjs && node scripts/catalog-gamakatsu-browser-qa.mjs && node scripts/catalog-zenaq-browser-qa.mjs && node scripts/catalog-palms-browser-qa.mjs && node scripts/catalog-apia-browser-qa.mjs && node scripts/catalog-jackall-browser-qa.mjs && node scripts/catalog-jackall-gekidaki-browser-qa.mjs && node scripts/catalog-jackall-switch-stick-browser-qa.mjs && node scripts/catalog-smith-browser-qa.mjs && node scripts/catalog-shimano-holiday-iso-browser-qa.mjs && node scripts/catalog-shimano-lightgame-bb-browser-qa.mjs && node scripts/catalog-shimano-holiday-spin-browser-qa.mjs && node scripts/catalog-shimano-surf-leader-browser-qa.mjs && node scripts/publication-browser-qa.mjs ;;
            chatgpt/catalog-lazy-load-v*|chatgpt/catalog-scale-v*) node scripts/target-browser-qa.mjs && node scripts/catalog-lazy-browser-qa.mjs ;;
            chatgpt/target-method-expansion-v*) node scripts/target-browser-qa.mjs ;;
            *) node scripts/browser-qa.mjs && node scripts/catalog-browser-qa.mjs ;;
          esac