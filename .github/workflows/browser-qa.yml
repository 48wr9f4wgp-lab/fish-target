name: rc-browser-qa

on:
  push:
    branches: [chatgpt/rc-v23-v8, chatgpt/catalog-production-v1, chatgpt/target-method-expansion-v1]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build RC
        run: npm run build
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA 375 390 430 and offline
        run: |
          npm run serve > /tmp/fish-target-serve.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/dist/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/dist/ >/dev/null
          if [ "$GITHUB_REF_NAME" = "chatgpt/target-method-expansion-v1" ]; then
            node scripts/target-browser-qa.mjs
          else
            node scripts/browser-qa.mjs
            node scripts/catalog-browser-qa.mjs
          fi
