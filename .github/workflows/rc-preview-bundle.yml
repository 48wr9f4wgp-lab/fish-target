name: rc-preview-bundle
on:
  push:
    branches:
      - chatgpt/rc33-preview-bundle
    paths-ignore:
      - rc-preview-bundle.json
      - rc-preview-manifest.json
      - rc-preview-chunks/**

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rc33-preview-bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build RC33
        run: npm run build
      - name: Pack dist into bounded base64 chunks
        run: |
          node --input-type=module <<'NODE'
          import {mkdir,readdir,readFile,rm,writeFile} from 'node:fs/promises';
          import path from 'node:path';
          const root='dist';
          const entries=[];
          async function walk(dir){
            for(const ent of await readdir(dir,{withFileTypes:true})){
              const full=path.join(dir,ent.name);
              if(ent.isDirectory()) await walk(full);
              else {
                const rel=path.relative(root,full).replaceAll('\\','/');
                const buf=await readFile(full);
                entries.push({file:rel,data:buf.toString('base64')});
              }
            }
          }
          await walk(root);
          entries.sort((a,b)=>a.file.localeCompare(b.file));
          await rm('rc-preview-chunks',{recursive:true,force:true});
          await mkdir('rc-preview-chunks',{recursive:true});
          const chunks=[];
          let current=[], currentSize=2;
          const MAX=180000;
          for(const entry of entries){
            const size=JSON.stringify(entry).length+1;
            if(current.length && currentSize+size>MAX){
              chunks.push(current); current=[]; currentSize=2;
            }
            current.push(entry); currentSize+=size;
          }
          if(current.length) chunks.push(current);
          const names=[];
          for(let i=0;i<chunks.length;i++){
            const name=`rc-preview-chunks/chunk-${String(i).padStart(3,'0')}.json`;
            names.push(name);
            await writeFile(name,JSON.stringify(chunks[i]));
          }
          await writeFile('rc-preview-manifest.json',JSON.stringify({
            sourceCommit:'56ccf4c97bcf3040a4d7169f456a71266717efdc',
            generatedAt:new Date().toISOString(),
            fileCount:entries.length,
            chunkCount:names.length,
            chunks:names
          }));
          console.log('BUNDLED',entries.length,'files into',names.length,'chunks');
          NODE
      - name: Commit chunks to temp branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rc-preview-manifest.json rc-preview-chunks
          git commit -m "chore: generate chunked RC33 preview bundle"
          git push origin HEAD:chatgpt/rc33-preview-bundle
