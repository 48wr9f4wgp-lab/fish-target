name: ios-local-field-coach-build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-local-field-coach-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device-build:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'chatgpt/local-field-coach-')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build web bundle and generate Xcode project
        run: bash ios/FishTargetLocal/bootstrap.sh

      - name: Build iOS device app
        run: |
          xcodebuild \
            -project ios/FishTargetLocal/FishTargetLocal.xcodeproj \
            -scheme FishTargetLocal \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
