name: batch3-apply-once

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/content-expansion-batch3-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/content-expansion-batch3-audit
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed Akahata content
        run: node scripts/batch3-apply-once.mjs
      - name: Preserve historical Batch 1 regression semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/content-expansion-batch1.test.mjs')
          s=p.read_text()
          old="""  assert.deepEqual(authoring.targets.map(x=>x.name),['カマス','オオモンハタ']);
            assert.deepEqual(authoring.targets.map(x=>x.methods.length+1),[2,2]);
            const sawara=authoring.existing.find(x=>x.species==='サワラ');"""
          new="""  const batch1Targets=authoring.targets.filter(x=>['カマス','オオモンハタ'].includes(x.name));
            assert.deepEqual(batch1Targets.map(x=>x.name),['カマス','オオモンハタ']);
            assert.deepEqual(batch1Targets.map(x=>x.methods.length+1),[2,2]);
            const sawara=authoring.existing.find(x=>x.species==='サワラ');"""
          if old not in s:
              raise SystemExit('Batch 1 historical assertion block not found')
          s=s.replace(old,new,1)
          s=s.replace("  assert.equal(report.baseline.species,62);","  assert.ok(report.baseline.species>=62,'later additive batches must preserve the Batch 1 species floor');",1)
          p.write_text(s)
          PY
      - name: Unit and build gate
        run: npm test
      - name: Commit generated Batch 3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/species-methods.v1.json authoring/content-expansion-queue.v1.json species-method-authoring-generated.js scripts/content-expansion-browser-qa.mjs scripts/publication-browser-qa.mjs tests/content-expansion-readiness.test.mjs tests/content-expansion-batch1.test.mjs tests/content-expansion-batch2.test.mjs tests/content-expansion-batch3.test.mjs
          git diff --cached --check
          git commit -m "content: add Akahata bottom rockfish depth"
          git push origin HEAD:chatgpt/content-expansion-batch3-audit
