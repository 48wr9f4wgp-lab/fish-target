name: deploy-pages

on:
  push:
    branches: [main, codex/release-rc1, chatgpt/feature-v23-tackle-catalog, chatgpt/catalog-multimaker-v13, chatgpt/v23-daiwa-catalog-preview, chatgpt/v23-visual-pass1, chatgpt/rc-v23-v8]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || github.ref == 'refs/heads/codex/release-rc1' && 'github-pages-rc' || 'github-pages-v23' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
