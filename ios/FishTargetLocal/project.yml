name: FishTargetLocal

options:
  deploymentTarget:
    iOS: "17.0"
  defaultSourceDirectoryType: group
  createIntermediateGroups: true

packages:
  LlamaBinary:
    path: Packages/LlamaBinary

targets:
  FishTargetLocal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: ../LocalFieldCoachPoC
        name: LocalFieldCoachPoC
      - path: WebApp
        type: folder
        buildPhase: resources
    dependencies:
      - package: LlamaBinary
        product: LlamaBinary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishtarget.local
        PRODUCT_NAME: FishTargetLocal
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fish Target Local"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets: []
